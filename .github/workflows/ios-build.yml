name: Check iOS build.

on:
  push:
    branches: [ci-build-ios]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Download Boost 1.76
        run: |
          curl --fail --location --retry 3 \
            https://archives.boost.io/release/1.76.0/source/boost_1_76_0.tar.gz \
            -o "$RUNNER_TEMP/boost.tar.gz"
          tar -xzf "$RUNNER_TEMP/boost.tar.gz" -C "$RUNNER_TEMP"

      - name: Build reConfig4Audio
        run: |
          xcodebuild \
            -project iOSiConfig4Audio/reConfig4Audio.xcodeproj \
            -target reConfig4Audio \
            -configuration Debug \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            "CONFIGURATION_BUILD_DIR=$RUNNER_TEMP/ios-build" \
            "HEADER_SEARCH_PATHS=$RUNNER_TEMP/boost_1_76_0" \
            'OTHER_CPLUSPLUSFLAGS=$(inherited) -D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION' \
            build

      - name: Package unsigned iOS app
        run: |
          test -d "$RUNNER_TEMP/ios-build/reConfig4Audio.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ios-build/reConfig4Audio.app" \
            "$RUNNER_TEMP/reConfig4Audio-unsigned-ios.zip"

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: reConfig4Audio-unsigned-ios
          path: ${{ runner.temp }}/reConfig4Audio-unsigned-ios.zip
          if-no-files-found: error
          retention-days: 7
